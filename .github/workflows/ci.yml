# Build, lints and unit tests. The differential and end-to-end tests need the C++ reference and
# the test material in work/ (PORTING.md, "Running the checks") and are skipped here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked --exclude fdk-aac-rs-cref
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # x86 and aarch64 variants
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --workspace --release --locked
      # the scalar paths of the AVX2 kernels
      - if: matrix.os == 'ubuntu-24.04'
        run: cargo test --workspace --release --locked
        env:
          FDK_AAC_RS_NO_SIMD: "1"

  test-i686:
    # x86_32 variant (x87 floating point)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: |
          rustup toolchain install stable --profile minimal -t i686-unknown-linux-gnu
          rustup default stable
      - run: cargo test --workspace --release --locked --target i686-unknown-linux-gnu

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - run: cargo check --workspace --all-targets --locked
