# Differential fuzz targets: the C++ reference (through fdk-aac-rs-cref) against the port
# (PORTING.md, "Differential fuzzing"; fuzz/README.md). A workspace of its own, excluded from the
# main workspace; built with cargo-fuzz (nightly) in the container of scripts/fuzz.sh. The
# `replay` and `seedgen` binaries also build with the stable toolchain.
[package]
name = "fdk-aac-rs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license-file = "../LICENSE.txt"

[package.metadata]
cargo-fuzz = true

[lib]
name = "fdk_aac_rs_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
fdk-aac-rs-cref = { path = "../crates/cref" }
fdk-aac-rs-fdk = { path = "../crates/fdk" }
fdk-aac-rs-aacdec = { path = "../crates/aacdec" }
fdk-aac-rs-aacenc = { path = "../crates/aacenc" }

[features]
# The replay and seedgen binaries (plain builds, not instrumented: `cargo fuzz build` skips them).
tools = []

[build-dependencies]
cc = "1"

[workspace]
members = ["."]

[profile.release]
opt-level = 3
debug = 1

[[bin]]
name = "decode_adts"
path = "fuzz_targets/decode_adts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_adif"
path = "fuzz_targets/decode_adif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_latm"
path = "fuzz_targets/decode_latm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_loas"
path = "fuzz_targets/decode_loas.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_raw"
path = "fuzz_targets/decode_raw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_drm"
path = "fuzz_targets/decode_drm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
test = false
doc = false
bench = false
required-features = ["tools"]

[[bin]]
name = "seedgen"
path = "src/bin/seedgen.rs"
test = false
doc = false
bench = false
required-features = ["tools"]
